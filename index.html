<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TapNote</title><style>body{font:17px system-ui;line-height:1.8;max-width:40rem;margin:10vh auto;padding:24px;color:#173e38}h1{color:#008577}a{color:#00796b}</style><h1>TapNote</h1><p>かざすとわかる、物の申し送り。</p><p>NFCタグや招待リンクは、iPhoneのTapNoteアプリで開いてください。データの閲覧にはログインとワークスペースへの参加が必要です。</p><p>アプリをインストール済みの場合は、受け取ったリンクを長押ししてTapNoteで開いてください。招待リンクはアプリの「メンバー招待」画面へ貼り付けて参加することもできます。</p><p>現在はTestFlightで配信準備中です。</p><footer><p>NamiWorks／TapNote運営</p><a href="/operator/">運営者情報</a> · <a href="/support/">ログイン不要のお問い合わせ</a></footer></html>
